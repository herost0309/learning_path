<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in — Test Shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 60px auto; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 22px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 15px; }
    .error { color: #c62828; margin-top: 12px; min-height: 20px; }
    .success { color: #2e7d32; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" data-testid="login-email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="••••••••" data-testid="login-password">
    <button type="submit" data-testid="login-submit">Sign in</button>
  </form>
  <div class="error" id="message" role="alert"></div>
  <script>
    document.getElementById('login-form').addEventListener('submit', event => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');
      message.className = 'error';
      if (!email) { message.textContent = 'Email is required'; return; }
      if (!password) { message.textContent = 'Password is required'; return; }
      if (email === 'demo@test.shop' && password === 'demo123') {
        message.className = 'success';
        message.textContent = 'Welcome back, demo!';
        setTimeout(() => { location.href = 'welcome.html'; }, 300);
      } else {
        message.textContent = 'Invalid email or password';
      }
    });
  </script>
</body>
</html>
